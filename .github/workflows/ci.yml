name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore TeeForge.slnx --locked-mode

      - name: Build
        run: dotnet build TeeForge.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/TeeForge.Tests/TeeForge.Tests.csproj -c Release --no-build --no-restore

      - name: Stress smoke
        if: runner.os == 'Linux'
        run: dotnet run -c Release --project tests/TeeForge.StressTests --no-build -- 25

      - name: Publish Native AOT smoke
        if: runner.os == 'Linux'
        run: dotnet publish tests/TeeForge.AotSmoke/TeeForge.AotSmoke.csproj -c Release -r linux-x64 --self-contained true --no-restore -o artifacts/aot

      - name: Run Native AOT smoke
        if: runner.os == 'Linux'
        run: ./artifacts/aot/TeeForge.AotSmoke

      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack src/TeeForge/TeeForge.csproj -c Release --no-build --no-restore -o artifacts/package

      - name: Verify package contents
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/verify-package.ps1

      - name: Upload package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: TeeForge-0.1.0
          path: artifacts/package/*
          if-no-files-found: error
