name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore TeeForge.Core.slnx --locked-mode

      - name: Build
        run: dotnet build TeeForge.Core.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/TeeForge.Tests/TeeForge.Tests.csproj -c Release --no-build --no-restore --minimum-expected-tests 1

      - name: Forward-only streaming example
        run: dotnet run -c Release --project samples/TeeForge.Streaming --no-build --no-restore

      - name: Run five quickstart recipes
        run: dotnet run -c Release --project samples/TeeForge.Quickstart --no-build --no-restore

      - name: Verify generated documentation and build documentation site
        shell: pwsh
        run: |
          ./eng/update-docs.ps1 -Check
          ./eng/build-docs-site.ps1

      - name: Stress smoke
        if: runner.os == 'Linux'
        run: dotnet run -c Release --project tests/TeeForge.StressTests --no-build -- 25

      - name: Publish Native AOT smoke
        if: runner.os == 'Linux'
        run: dotnet publish tests/TeeForge.AotSmoke/TeeForge.AotSmoke.csproj -c Release -r linux-x64 --self-contained true --no-restore -o artifacts/aot

      - name: Run Native AOT smoke
        if: runner.os == 'Linux'
        run: ./artifacts/aot/TeeForge.AotSmoke

      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack src/TeeForge/TeeForge.csproj -c Release --no-build --no-restore -o artifacts/package

      - name: Verify package contents
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $version = dotnet msbuild src/TeeForge/TeeForge.csproj -nologo -getProperty:PackageVersion
          if ($LASTEXITCODE -ne 0) { throw 'Could not evaluate the package version.' }
          ./eng/verify-package.ps1 -ExpectedVersion $version.Trim()

      - name: Record package checksums
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $lines = Get-ChildItem artifacts/package -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content artifacts/package/SHA256SUMS -Encoding utf8NoBOM

      - name: Upload package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-package
          path: artifacts/package/*
          if-no-files-found: error

  experimental-storage:
    name: Experimental storage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Restore experimental tests
        run: dotnet restore tests/TeeForge.Experimental.Storage.Tests --locked-mode
      - name: Test experimental storage
        run: dotnet test --project tests/TeeForge.Experimental.Storage.Tests -c Release --no-restore --minimum-expected-tests 1
      - name: Restore experimental benchmarks
        run: dotnet restore benchmarks/TeeForge.Experimental.Storage.Benchmarks --locked-mode
      - name: Build experimental benchmarks
        run: dotnet build benchmarks/TeeForge.Experimental.Storage.Benchmarks -c Release --no-restore
      - name: Restore mount tests
        if: runner.os == 'Windows'
        run: dotnet restore tests/TeeForge.Mount.Tests --locked-mode
      - name: Test mounting prototype
        if: runner.os == 'Windows'
        run: dotnet test --project tests/TeeForge.Mount.Tests -c Release --no-restore --minimum-expected-tests 1
