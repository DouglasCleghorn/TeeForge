name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version; the selected Git ref must be the matching v-prefixed tag.
        required: true
        default: 0.1.0
        type: string
      publish_to_nuget:
        description: Exchange an OIDC token and publish to nuget.org.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out selected ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and requested version
        shell: pwsh
        run: |
          if ($env:PACKAGE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw 'Expected a three-part package version with an optional prerelease suffix.'
          }
          $expectedTag = "v$env:PACKAGE_VERSION"
          $actualTag = git describe --tags --exact-match HEAD
          if ($LASTEXITCODE -ne 0 -or $actualTag -ne $expectedTag -or
              $env:GITHUB_REF -ne "refs/tags/$expectedTag") {
            throw "Selected ref must point exactly at tag '$expectedTag'; found '$actualTag'."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore TeeForge.Core.slnx --locked-mode

      - name: Build
        run: dotnet build TeeForge.Core.slnx -c Release --no-restore -p:Version="$PACKAGE_VERSION"

      - name: Test
        run: dotnet test --project tests/TeeForge.Tests/TeeForge.Tests.csproj -c Release --no-build --no-restore --minimum-expected-tests 1

      - name: Stress
        run: dotnet run -c Release --project tests/TeeForge.StressTests --no-build -- 50

      - name: Pack
        run: dotnet pack src/TeeForge/TeeForge.csproj -c Release --no-build --no-restore -p:PackageVersion="$PACKAGE_VERSION" -o artifacts/package

      - name: Verify package contents
        shell: pwsh
        run: ./eng/verify-package.ps1 -ExpectedVersion $env:PACKAGE_VERSION

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TeeForge-${{ inputs.version }}
          path: artifacts/package/*
          if-no-files-found: error

      - name: Obtain short-lived NuGet credential
        if: inputs.publish_to_nuget
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: inputs.publish_to_nuget
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'artifacts/package/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
